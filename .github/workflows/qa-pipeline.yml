name: QA Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'index.html'
      - 'style.css'
      - 'erplorer.js'
      - 'erplorer.config.js'
      - 'erplorer-insights.js'
      - 'erplorer-bench.js'
      - 'erplorer-bench-ai.js'
      - 'erplorer-runner-client.js'
      - '.github/workflows/qa-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build search index
        run: node scripts/build-index.js
        env:
          ERPLORER_VERBOSE: '0'

      - name: Commit rebuilt index back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add search-index.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to search-index.json — skipping commit."
          else
            git commit -m "chore: rebuild search-index.json"
            git push
          fi